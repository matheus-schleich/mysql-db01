name: Testar conexão MySQL

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Host do servidor MySQL'
        default: '---'
        required: true
        type: string
      query:
        description: 'Ficheiro SQL a executar'
        default: 'create.sql'
        required: true
        type: string

jobs:
  testar-mysql:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar cliente MySQL
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Verificar ficheiros disponíveis
        run: ls -l

      - name: Executar query no MySQL remoto
        env:
          MYSQL_HOST: ${{ inputs.server }}
          MYSQL_USER: gestor
          MYSQL_PASSWORD: Abcd123!
          MYSQL_QUERY_FILE: ${{ inputs.query }}
        run: |
          echo "Conectando ao servidor MySQL: $MYSQL_HOST"
          echo "Executando ficheiro: $MYSQL_QUERY_FILE"
          mysql -h "$MYSQL_HOST" -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" < "$MYSQL_QUERY_FILE"
