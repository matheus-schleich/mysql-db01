name: Testar ligacao postgre

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Servidor a testar'
        default: '---'
        required: true
        type: string

jobs:
  greet:
    runs-on: ubuntu-latest
    environment: database-test

    steps:
     # Runs a single command using the runners shell
    - name: Send greeting
      run: echo "Hello ${{ inputs.name }}"
    - name: Instalar cliente PostgreSQL
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Testar ligação ao PostgreSQL
        env:
          PGHOST: ${{ inputs.name }}
          PGPORT: 5432
          PGDATABASE: postgres
          PGUSER: ${{ secrets.USER }}
          PGPASSWORD: ${{ secrets.PASS }}
        run: |
          psql -c "SELECT version();"
